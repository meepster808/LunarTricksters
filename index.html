<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LunarTricksters</title>

  <!-- styles.css must sit in the SAME folder as this file -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <h1>LunarTricksters</h1>
    <nav class="nav">
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#gallery">Gallery</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section id="home" class="section">
      <h2>Welcome</h2>
      <p>Showcasing the LunarTricksters collection.</p>
    </section>

    <section id="about" class="section">
      <h2>About</h2>
      <p>A simple GitHub Pages site. Images must be in the same folder as this file.</p>
    </section>

    <section id="gallery" class="section">
      <h2>Gallery</h2>

      <div class="grid">
        <figure class="card">
          <img src="Background_Blue.png" alt="Background Blue">
          <figcaption>Background — Blue</figcaption>
        </figure>

        <figure class="card">
          <img src="Background_Grey.png" alt="Background Grey">
          <figcaption>Background — Grey</figcaption>
        </figure>

        <figure class="card">
          <img src="Background_Red.png" alt="Background Red">
          <figcaption>Background — Red</figcaption>
        </figure>
      </div>

      <h3>SVG Samples</h3>
      <div class="grid">
        <figure class="card">
          <img src="nft1.svg" alt="NFT 1">
          <figcaption>NFT 1 (SVG)</figcaption>
        </figure>
        <figure class="card">
          <img src="nft2.svg" alt="NFT 2">
          <figcaption>NFT 2 (SVG)</figcaption>
        </figure>
        <figure class="card">
          <img src="nft3.svg" alt="NFT 3">
          <figcaption>NFT 3 (SVG)</figcaption>
        </figure>
      </div>
    </section>

    <section id="contact" class="section">
      <h2>Contact</h2>
      <ul>
        <li><a href="#">Twitter</a></li>
        <li><a href="#">Discord</a></li>
        <li><a href="mailto:hello@nftproject.com">Email</a></li>
      </ul>
    </section>
  </main>

  <footer class="site-footer">
    <p>© 2025 LunarTricksters</p>
  </footer>
</body>
</html>
